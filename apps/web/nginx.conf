# Static web app + reverse proxy to the API Service (same origin, no CORS needed)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve the API Service at request time through the cluster DNS
    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
    set $api_upstream http://api.inventory.svc.cluster.local;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Pod name, shown in the page header to see load balancing between replicas
    location = /pod {
        default_type text/plain;
        return 200 "$hostname\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
