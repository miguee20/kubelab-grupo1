<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grocery Inventory · KubeLab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Grocery Inventory</h1>
    <p class="sub">KubeLab · Group 1 · served by <span id="pod">web</span></p>
  </header>

  <main>
    <section class="card">
      <h2 id="form-title">Add product</h2>
      <form id="product-form">
        <input type="hidden" id="product-id">
        <label>Name <input id="name" required maxlength="80" placeholder="Rice 1 lb"></label>
        <label>Category <input id="category" maxlength="40" placeholder="Grains"></label>
        <label>Price (Q) <input id="price" type="number" min="0" step="0.01" value="0"></label>
        <label>Stock <input id="stock" type="number" min="0" step="1" value="0"></label>
        <div class="actions">
          <button type="submit" id="submit">Save</button>
          <button type="button" id="cancel" class="secondary" hidden>Cancel</button>
        </div>
      </form>
      <p id="status" role="status"></p>
    </section>

    <section class="card">
      <h2>Products</h2>
      <table>
        <thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
