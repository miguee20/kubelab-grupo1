# CI/CD for the API (CD-01): only runs when apps/api changes.
# test -> build and push image tagged with the short commit hash -> update k8s/apps/api -> Argo CD syncs.
name: api

on:
  push:
    branches: [main]
    paths: ["apps/api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["apps/api/**", ".github/workflows/api.yml"]
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/miguee20/kubelab-api
  MANIFEST: k8s/apps/api/api.yaml

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm test

  build-and-deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Do not keep the read-only GITHUB_TOKEN in git config: the manifest commit is pushed with GH_PAT
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # SEC-03: pipeline credentials come from Doppler (only DOPPLER_TOKEN lives in GitHub)
      - name: Load secrets from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          GH_PAT=$(curl -fsS -u "${DOPPLER_TOKEN}:" \
            "https://api.doppler.com/v3/configs/config/secrets/download?format=json" | jq -r '.GH_PAT')
          if [ -z "$GH_PAT" ] || [ "$GH_PAT" = "null" ]; then echo "GH_PAT not found in Doppler"; exit 1; fi
          echo "::add-mask::$GH_PAT"
          echo "GH_PAT=$GH_PAT" >> "$GITHUB_ENV"

      - name: Short commit hash
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ env.IMAGE }}:${{ env.TAG }}
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: APP_VERSION=${{ env.TAG }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Update image tag in the manifest
        run: |
          sed -i -E "s|(image: ${IMAGE}):[A-Za-z0-9._-]+|\1:${TAG}|" "$MANIFEST"
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git"
          git commit -am "chore(api): deploy image ${TAG} [skip ci]" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
