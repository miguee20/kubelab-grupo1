# Doppler project "kubelab", config "prd" -> Kubernetes Secret inventory/inventory-secrets (SEC-02).
# The only Secret created by hand is doppler-operator-system/doppler-token-secret (the Doppler
# service token); see docs/04-applications.md. Deployments annotated with
# secrets.doppler.com/reload are restarted when a value changes in Doppler.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: inventory-secrets
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubelab
  config: prd
  resyncSeconds: 120
  managedSecret:
    name: inventory-secrets
    namespace: inventory
    type: Opaque
---
# Same Doppler config -> Secret monitoring/grafana-secrets (Grafana admin and instructor viewer)
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: grafana-secrets
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubelab
  config: prd
  resyncSeconds: 120
  managedSecret:
    name: grafana-secrets
    namespace: monitoring
    type: Opaque
---
# Same Doppler config -> Secret argocd/argocd-users (admin and instructor passwords for Argo CD)
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: argocd-users
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubelab
  config: prd
  resyncSeconds: 120
  managedSecret:
    name: argocd-users
    namespace: argocd
    type: Opaque
---
# Same Doppler config -> Secret argocd/argocd-repo: credentials Argo CD uses to read this
# repository, also while it is private. The label is what makes Argo CD treat it as a repository.
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: argocd-repo
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret
  project: kubelab
  config: prd
  resyncSeconds: 120
  secrets: [ARGOCD_REPO_TYPE, ARGOCD_REPO_URL, ARGOCD_REPO_USERNAME, GH_PAT]
  processors:
    ARGOCD_REPO_TYPE: {type: plain, asName: type}
    ARGOCD_REPO_URL: {type: plain, asName: url}
    ARGOCD_REPO_USERNAME: {type: plain, asName: username}
    GH_PAT: {type: plain, asName: password}
  managedSecret:
    name: argocd-repo
    namespace: argocd
    type: Opaque
    labels:
      argocd.argoproj.io/secret-type: repository
