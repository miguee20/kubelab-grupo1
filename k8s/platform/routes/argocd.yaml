# Argo CD UI at http://argocd.grupo1.lab (CD-02)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  entryPoints: [web]
  routes:
    - match: Host(`argocd.grupo1.lab`)
      kind: Rule
      services:
        - name: argocd-server
          port: 80
