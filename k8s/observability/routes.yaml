# http://grafana.grupo1.lab and http://prometheus.grupo1.lab (NET-03)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints: [web]
  routes:
    - match: Host(`grafana.grupo1.lab`)
      kind: Rule
      services:
        - name: grafana
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  entryPoints: [web]
  routes:
    - match: Host(`prometheus.grupo1.lab`)
      kind: Rule
      services:
        - name: prometheus-server
          port: 80
