# Inventory web app (APP-02): nginx serving static files and proxying /api/* to the api Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: inventory
  labels: {app: web}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: web}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: web}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: web}
      containers:
        - name: web
          image: ghcr.io/miguee20/kubelab-web:03c1c59
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: inventory
  labels: {app: web}
spec:
  selector: {app: web}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: web
  namespace: inventory
spec:
  entryPoints: [web]
  routes:
    - match: Host(`app.grupo1.lab`)
      kind: Rule
      services:
        - name: web
          port: 80
