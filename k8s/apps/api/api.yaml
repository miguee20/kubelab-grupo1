# Inventory API (APP-01): 2+ replicas with probes, requests/limits and rolling updates (HA-01, HA-02).
# The image tag is the short commit hash and is updated by the GitHub Actions pipeline (APP-05).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: inventory
  labels: {app: api}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: api}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
        secrets.doppler.com/reload: "true"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: api}
      containers:
        - name: api
          image: ghcr.io/miguee20/kubelab-api:58c2151
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: inventory-secrets, key: DATABASE_URL}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 128Mi}
          # Keep serving for a few seconds after the pod is marked for deletion, while Traefik
          # removes it from its endpoints; without this a rollout returns some 502 responses
          lifecycle:
            preStop:
              exec: {command: [sleep, "8"]}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: inventory
  labels: {app: api}
spec:
  selector: {app: api}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api
  namespace: inventory
spec:
  entryPoints: [web]
  routes:
    - match: Host(`api.grupo1.lab`)
      kind: Rule
      services:
        - name: api
          port: 80
