# Observability stack (OBS-03, OBS-04): Grafana and its configuration from code.
# Grafana: admin credentials from Doppler; datasources and dashboards provisioned from code (OBS-03)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: ">=8.0.0"
    helm:
      valuesObject:
        admin:
          existingSecret: grafana-secrets
          userKey: GRAFANA_ADMIN_USER
          passwordKey: GRAFANA_ADMIN_PASSWORD
        persistence:
          enabled: true
          size: 1Gi
          storageClassName: nfs
        resources:
          requests: {cpu: 25m, memory: 96Mi}
          limits: {memory: 256Mi}
        # Only one pod may open the SQLite database on the RWO volume: stop the old pod before starting the new one
        deploymentStrategy:
          type: Recreate
        # First start runs ~200 SQLite migrations on NFS over an HDD; give it time before liveness kicks in
        livenessProbe:
          httpGet: {path: /api/health, port: 3000}
          initialDelaySeconds: 600
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 10
        readinessProbe:
          httpGet: {path: /api/health, port: 3000}
          periodSeconds: 10
          timeoutSeconds: 5
        grafana.ini:
          users:
            auto_assign_org_role: Viewer
          analytics:
            check_for_updates: false
            reporting_enabled: false
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                uid: prometheus
                type: prometheus
                access: proxy
                url: http://prometheus-server.monitoring.svc.cluster.local
                isDefault: true
              - name: Loki
                uid: loki
                type: loki
                access: proxy
                url: http://loki.monitoring.svc.cluster.local:3100
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: kubelab
                orgId: 1
                folder: KubeLab
                type: file
                disableDeletion: true
                editable: false
                options:
                  path: /var/lib/grafana/dashboards/kubelab
        dashboardsConfigMaps:
          kubelab: grafana-dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
    retry: {limit: 20, backoff: {duration: 15s, factor: 2, maxDuration: 3m}}
---
# Dashboards, IngressRoutes and the read-only Grafana user (k8s/observability)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/miguee20/kubelab-grupo1.git
    targetRevision: main
    path: k8s/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, SkipDryRunOnMissingResource=true]
    retry: {limit: 20, backoff: {duration: 15s, factor: 2, maxDuration: 3m}}
