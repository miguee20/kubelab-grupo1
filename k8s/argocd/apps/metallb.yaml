# MetalLB in layer 2 mode (NET-01).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://metallb.github.io/metallb
    chart: metallb
    targetRevision: 0.16.1
    helm:
      valuesObject:
        # Plain L2 mode: no BGP, so neither FRR nor the frr-k8s daemon are deployed
        frrk8s:
          enabled: false
        controller:
          resources: {requests: {cpu: 10m, memory: 48Mi}, limits: {memory: 160Mi}}
        speaker:
          frr: {enabled: false}
          # speakers only on workers, where Traefik runs; the control plane stays free
          tolerateMaster: false
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers: [/spec/conversion/webhook/clientConfig/caBundle]
---
# IPAddressPool and L2Advertisement (needs the MetalLB CRDs; retries until they exist)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/miguee20/kubelab-grupo1.git
    targetRevision: main
    path: k8s/platform/metallb
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [SkipDryRunOnMissingResource=true]
    retry: {limit: 20, backoff: {duration: 15s, factor: 2, maxDuration: 3m}}
