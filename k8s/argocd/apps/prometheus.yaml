# Observability stack (OBS-01): metrics, stored on the default NFS StorageClass (PER-02).
# Prometheus: node-exporter (nodes), kube-state-metrics + cAdvisor (Kubernetes) and every pod
# annotated with prometheus.io/scrape, which includes the API /metrics endpoint.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.40.3
    helm:
      valuesObject:
        alertmanager:
          enabled: false
        prometheus-pushgateway:
          enabled: false
        kube-state-metrics:
          # Only the objects the dashboard and the instructor need
          collectors: [deployments, daemonsets, statefulsets, replicasets, pods, nodes, horizontalpodautoscalers, persistentvolumeclaims, namespaces]
          livenessProbe:
            initialDelaySeconds: 30
            timeoutSeconds: 15
            failureThreshold: 6
          readinessProbe:
            initialDelaySeconds: 30
            timeoutSeconds: 15
            failureThreshold: 6
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - {key: kubernetes.io/hostname, operator: In, values: [k3s-w1]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 96Mi}
        prometheus-node-exporter:
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 48Mi}
        configmapReload:
          prometheus:
            resources:
              requests: {cpu: 5m, memory: 8Mi}
              limits: {memory: 32Mi}
        # Lean scrape configuration (replaces the chart default list). Keeps exactly what OBS-01 and the
        # dashboard need: node-exporter + kube-state-metrics (annotated Services), per-pod CPU/memory from
        # cAdvisor, and annotated pods (the API /metrics). API-server and kubelet histograms are not collected.
        # Chart 29.x renders its own `scrapeConfigs` map (10 default jobs) in addition to serverFiles.
        # All defaults are disabled; the lean jobs below use kubelab-* names so they can never collide.
        scrapeConfigs:
          prometheus: {enabled: false}
          kubernetes-apiservers: {enabled: false}
          kubernetes-api-servers: {enabled: false}
          kubernetes-nodes: {enabled: false}
          kubernetes-nodes-cadvisor: {enabled: false}
          kubernetes-service-endpoints: {enabled: false}
          kubernetes-service-endpoints-slow: {enabled: false}
          kubernetes-services: {enabled: false}
          kubernetes-pods: {enabled: false}
          kubernetes-pods-slow: {enabled: false}
          prometheus-pushgateway: {enabled: false}
        serverFiles:
          prometheus.yml:
            scrape_configs:
              - job_name: kubelab-prometheus
                static_configs:
                  - targets: [localhost:9090]
              - job_name: kubelab-cadvisor
                scheme: https
                metrics_path: /metrics/cadvisor
                tls_config:
                  ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  insecure_skip_verify: true
                bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                kubernetes_sd_configs:
                  - role: node
                relabel_configs:
                  - action: labelmap
                    regex: __meta_kubernetes_node_label_(.+)
                metric_relabel_configs:
                  - source_labels: [__name__]
                    action: keep
                    regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes
                  - source_labels: [container]
                    action: drop
                    regex: "|POD"
              - job_name: kubelab-service-endpoints
                # kube-state-metrics exports its own namespace/pod labels (e.g. namespace="inventory").
                # Without honor_labels the target label namespace="monitoring" would win and rename
                # them to exported_namespace, so the dashboard filters would match nothing.
                honor_labels: true
                kubernetes_sd_configs:
                  - role: endpoints
                relabel_configs:
                  - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
                    action: keep
                    regex: "true"
                  - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
                    action: replace
                    target_label: __scheme__
                    regex: (https?)
                  - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
                    action: replace
                    target_label: __metrics_path__
                    regex: (.+)
                  - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
                    action: replace
                    target_label: __address__
                    regex: (.+?)(?::\d+)?;(\d+)
                    replacement: $1:$2
                  - action: labelmap
                    regex: __meta_kubernetes_service_label_(.+)
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace
                  - source_labels: [__meta_kubernetes_service_name]
                    target_label: service
                  - source_labels: [__meta_kubernetes_pod_node_name]
                    target_label: node
                metric_relabel_configs:
                  - source_labels: [__name__]
                    action: drop
                    regex: (go|promhttp|process)_.*|node_scrape_collector_.*|.*_bucket
              - job_name: kubelab-pods
                kubernetes_sd_configs:
                  - role: pod
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                    action: keep
                    regex: "true"
                  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                    action: replace
                    target_label: __metrics_path__
                    regex: (.+)
                  - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                    action: replace
                    target_label: __address__
                    regex: (.+?)(?::\d+)?;(\d+)
                    replacement: $1:$2
                  - action: labelmap
                    regex: __meta_kubernetes_pod_label_(.+)
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
                  - source_labels: [__meta_kubernetes_pod_node_name]
                    target_label: node
                  - source_labels: [__meta_kubernetes_pod_phase]
                    action: drop
                    regex: Pending|Succeeded|Failed|Completed
                metric_relabel_configs:
                  - source_labels: [__name__]
                    action: keep
                    regex: http_requests_total|http_request_duration_seconds_(sum|count)|nodejs_heap_size_used_bytes|process_resident_memory_bytes|process_cpu_seconds_total
        server:
          retention: 2d
          global:
            scrape_interval: 60s
            scrape_timeout: 20s
            evaluation_interval: 60s
          persistentVolume:
            enabled: true
            size: 2Gi
            storageClass: nfs
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 448Mi}
          # Heavy pods are spread one group per worker (w1: Prometheus, w2: Argo CD + PostgreSQL, w3: Loki + Grafana)
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - {key: kubernetes.io/hostname, operator: In, values: [k3s-w1]}
          strategy:
            type: Recreate
          # WAL replay on an HDD can take minutes: startup probe allows up to 10 min, then lenient probes
          startupProbe:
            enabled: true
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          livenessProbeTimeout: 30
          livenessProbeFailureThreshold: 6
          readinessProbeTimeout: 30
          readinessProbeFailureThreshold: 6
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
