# Observability stack (OBS-01): metrics, stored on the default NFS StorageClass (PER-02).
# Prometheus: node-exporter (nodes), kube-state-metrics + cAdvisor (Kubernetes) and every pod
# annotated with prometheus.io/scrape, which includes the API /metrics endpoint.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: ">=25.0.0"
    helm:
      valuesObject:
        alertmanager:
          enabled: false
        prometheus-pushgateway:
          enabled: false
        kube-state-metrics:
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 96Mi}
        prometheus-node-exporter:
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 48Mi}
        configmapReload:
          prometheus:
            resources:
              requests: {cpu: 5m, memory: 8Mi}
              limits: {memory: 32Mi}
        server:
          retention: 2d
          global:
            scrape_interval: 30s
            evaluation_interval: 30s
          persistentVolume:
            enabled: true
            size: 2Gi
            storageClass: nfs
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 448Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
