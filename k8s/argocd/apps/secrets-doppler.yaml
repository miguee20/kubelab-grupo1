# Doppler Kubernetes Operator (SEC-02): syncs Doppler secrets into Kubernetes Secrets
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: doppler-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.doppler.com
    chart: doppler-kubernetes-operator
    targetRevision: 1.7.5
  destination:
    server: https://kubernetes.default.svc
    namespace: doppler-operator-system
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
# DopplerSecret resources versioned in the repository (needs the operator CRDs)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: doppler-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/miguee20/kubelab-grupo1.git
    targetRevision: main
    path: k8s/platform/doppler
  destination:
    server: https://kubernetes.default.svc
    namespace: doppler-operator-system
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [SkipDryRunOnMissingResource=true]
    retry: {limit: 20, backoff: {duration: 15s, factor: 2, maxDuration: 3m}}
