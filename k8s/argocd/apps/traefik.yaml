# Traefik with a LoadBalancer Service pinned to 10.10.10.200 from the MetalLB pool (NET-02).
# Entry points: web (80) for every IngressRoute, postgres (5432) for the database IngressRouteTCP.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: ">=37.0.0"
    helm:
      valuesObject:
        deployment:
          replicas: 2
        podDisruptionBudget:
          enabled: true
          minAvailable: 1
        resources:
          requests: {cpu: 50m, memory: 48Mi}
          limits: {memory: 128Mi}
        service:
          type: LoadBalancer
          annotations:
            metallb.io/loadBalancerIPs: 10.10.10.200
        ports:
          web:
            exposedPort: 80
          websecure:
            expose: {default: false}
          postgres:
            port: 5432
            exposedPort: 5432
            protocol: TCP
            expose: {default: true}
        providers:
          kubernetesCRD:
            enabled: true
            allowCrossNamespace: true
          kubernetesIngress:
            enabled: false
        ingressRoute:
          dashboard:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: {limit: 10, backoff: {duration: 15s, factor: 2, maxDuration: 3m}}
---
# IngressRoutes for platform tools (Argo CD); needs the Traefik CRDs
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-routes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/miguee20/kubelab-grupo1.git
    targetRevision: main
    path: k8s/platform/routes
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [SkipDryRunOnMissingResource=true]
    retry: {limit: 20, backoff: {duration: 15s, factor: 2, maxDuration: 3m}}
