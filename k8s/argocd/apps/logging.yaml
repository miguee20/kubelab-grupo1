# Observability stack (OBS-02): logs, stored on the default NFS StorageClass (PER-02).
# Loki in single-binary mode with filesystem storage; caches, gateway and canary disabled
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: ">=6.0.0"
    helm:
      valuesObject:
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          limits_config:
            retention_period: 48h
          compactor:
            retention_enabled: true
            delete_request_store: filesystem
        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            size: 2Gi
            storageClass: nfs
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
        read: {replicas: 0}
        write: {replicas: 0}
        backend: {replicas: 0}
        chunksCache: {enabled: false}
        resultsCache: {enabled: false}
        gateway: {enabled: false}
        lokiCanary: {enabled: false}
        test: {enabled: false}
        sidecar:
          rules: {enabled: false}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
# Promtail DaemonSet: ships container logs from every node (control plane included) to Loki
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: promtail
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: promtail
    targetRevision: ">=6.0.0"
    helm:
      valuesObject:
        config:
          clients:
            - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 96Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
