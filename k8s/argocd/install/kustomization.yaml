# Argo CD installed from the upstream stable manifest, trimmed for a 6 GB host:
# - Dex, notifications and ApplicationSet controllers are removed (not used)
# - server runs in insecure mode because TLS is not used inside the lab (Traefik serves HTTP)
# - every component gets memory requests/limits; repo-server and controller get 512Mi because
#   rendering the Grafana/Loki/Prometheus charts (large Helm repo indexes) needs it
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

patches:
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-dex-server
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-notifications-controller
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-applicationset-controller
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        server.insecure: "true"
        controller.status.processors: "5"
        controller.operation.processors: "3"
        reposerver.parallelism.limit: "1"
        # Large Helm repository indexes (prometheus-community, grafana) take minutes to fetch and render here
        controller.repo.server.timeout.seconds: "300"
  - target: {kind: StatefulSet, name: argocd-application-controller}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 100m, memory: 192Mi}, limits: {memory: 512Mi}}
  - target: {kind: Deployment, name: argocd-repo-server}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
  - target: {kind: Deployment, name: argocd-server}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 25m, memory: 48Mi}, limits: {memory: 160Mi}}
  - target: {kind: Deployment, name: argocd-redis}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 10m, memory: 24Mi}, limits: {memory: 64Mi}}
  # Heavy pods are spread across workers; Argo CD controller and repo-server prefer k3s-w2
  - target: {kind: StatefulSet, name: argocd-application-controller}
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - {key: kubernetes.io/hostname, operator: In, values: [k3s-w2]}
  - target: {kind: Deployment, name: argocd-repo-server}
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - {key: kubernetes.io/hostname, operator: In, values: [k3s-w2]}
  # helm/kustomize commands inside the repo-server may run up to 5 minutes (default 90 s)
  - target: {kind: Deployment, name: argocd-repo-server}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: ARGOCD_EXEC_TIMEOUT, value: "5m"}
