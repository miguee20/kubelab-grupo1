# Argo CD installed from the upstream stable manifest, trimmed for a 6 GB host:
# - Dex, notifications and ApplicationSet controllers are removed (not used)
# - server runs in insecure mode because TLS is not used inside the lab (Traefik serves HTTP)
# - every component gets memory requests/limits
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

patches:
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-dex-server
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-notifications-controller
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-applicationset-controller
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        server.insecure: "true"
        controller.status.processors: "5"
        controller.operation.processors: "3"
        reposerver.parallelism.limit: "1"
  - target: {kind: StatefulSet, name: argocd-application-controller}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 100m, memory: 192Mi}, limits: {memory: 384Mi}}
  - target: {kind: Deployment, name: argocd-repo-server}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 50m, memory: 96Mi}, limits: {memory: 256Mi}}
  - target: {kind: Deployment, name: argocd-server}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 25m, memory: 48Mi}, limits: {memory: 160Mi}}
  - target: {kind: Deployment, name: argocd-redis}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {requests: {cpu: 10m, memory: 24Mi}, limits: {memory: 64Mi}}
